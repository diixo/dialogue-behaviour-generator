<div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>Поле</th><th>{{ before_label|default:'До' }}</th><th>{{ after_label|default:'После' }}</th></tr></thead><tbody>
{% for change in changes %}<tr><td><code>{{ change.field }}</code></td><td><code class="text-secondary">{{ change.before }}</code></td><td class="changed-value"><code>{{ change.after }}</code></td></tr>{% empty %}<tr><td colspan="3" class="text-secondary">Изменений нет.</td></tr>{% endfor %}
</tbody></table></div>
