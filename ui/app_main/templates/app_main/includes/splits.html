<div class="table-responsive"><table class="table align-middle mb-0">
<thead><tr><th>Split</th><th>Эпизоды</th><th>Ходы / policy / response / history</th><th>Extraction</th><th>Версия контента</th></tr></thead>
<tbody>{% for s in splits %}<tr><td><a href="{% url 'app_main:datasets' %}?split={{ s.split }}">{{ s.split }}</a></td><td>{{ s.episodes }}</td><td>{{ s.turns }}</td><td>{{ s.extraction }}</td><td><code title="{{ s.hash }}">{{ s.hash|slice:':12' }}</code></td></tr>{% empty %}<tr><td colspan="5" class="text-secondary">Канонические эпизоды не найдены.</td></tr>{% endfor %}</tbody>
</table></div>
